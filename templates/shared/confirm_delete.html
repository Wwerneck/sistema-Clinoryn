{% extends "base.html" %}
{% block title %}Confirmar exclusão | Clinoryn{% endblock %}
{% block content %}
<section class="card auth-card">
  <h1>Confirmar exclusão</h1>
  <p>Deseja realmente excluir <strong>{{ object }}</strong>?</p>
  <form method="post">{% csrf_token %}<button type="submit">Sim, excluir</button> <a class="button-link" href="{% url 'agenda:list' %}">Cancelar</a></form>
</section>
{% endblock %}
