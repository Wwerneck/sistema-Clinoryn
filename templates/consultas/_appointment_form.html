<div class="booking-stepper" aria-label="Etapas do agendamento"><span class="active">1<small>Dados</small></span><i></i><span>2<small>Horário</small></span><i></i><span>3<small>Confirmação</small></span></div><form method="post" action="{% url 'consultas:create' %}" class="modal-booking-form">{% csrf_token %}{% if form.non_field_errors %}<div class="alert alert-danger">{{ form.non_field_errors }}</div>{% endif %}<div class="form-grid">{% for field in form %}<div class="field{% if field.name == 'observacoes_administrativas' %} field-wide{% endif %}"><label for="{{ field.id_for_label }}">{{ field.label }}</label>{{ field }}{% for error in field.errors %}<small class="field-error">{{ error }}</small>{% endfor %}</div>{% endfor %}</div><div class="modal-footer px-0 pb-0"><button type="button" class="btn-pro" data-bs-dismiss="modal">Cancelar</button><button class="btn-pro btn-pro-primary" type="submit">Confirmar agendamento <i class="bi bi-arrow-right"></i></button></div></form>
