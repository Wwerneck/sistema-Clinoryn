<article class="stat-card stat-card-{{ tone|default:'blue' }}"><div class="stat-card-top"><span class="stat-icon"><i class="bi {{ icon|default:'bi-activity' }}"></i></span>{% if href %}<a href="{{ href }}" class="stat-link" aria-label="Ver {{ title }}"><i class="bi bi-arrow-up-right"></i></a>{% endif %}</div><span class="stat-title">{{ title }}</span><strong class="stat-value">{{ value }}</strong>{% if caption %}<small class="stat-caption">{{ caption }}</small>{% endif %}</article>
