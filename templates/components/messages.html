{% if messages %}<div aria-live="polite" aria-atomic="true">{% for message in messages %}<div class="alert alert-{% if message.tags == 'error' %}danger{% else %}{{ message.tags|default:'info' }}{% endif %} alert-dismissible fade show shadow-sm" role="alert"><i class="bi bi-info-circle me-2" aria-hidden="true"></i>{{ message }}<button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Fechar"></button></div>{% endfor %}</div>{% endif %}
